    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumuman KELULUSAN 2026 - SMAN 3 Wonogiri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; }
        .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .nilai-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #e2e8f0; }
        .nilai-row:last-child { border-bottom: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

<header class="gradient-bg text-white py-8 px-4 text-center shadow-lg">
    <h1 class="text-2xl md:text-3xl font-bold uppercase tracking-wider">SMA Negeri 3 Wonogiri</h1>
    <p class="text-sm md:text-base opacity-90 mt-2">Pengumuman Kelulusan Tahun Ajaran 2026</p>
</header>

<main class="flex-grow container mx-auto px-4 py-10 max-w-lg">

    <!-- LOGIN -->
    <div id="loginSection" class="glass-card p-8">
        <h2 class="text-xl font-semibold text-gray-800 mb-6 text-center border-b pb-4">Login Peserta</h2>
        
        <div>
            <label class="block text-sm font-medium text-gray-700">NISN</label>
            <input type="text" id="inputNisn" placeholder="Masukkan 10 digit NISN"
                class="w-full p-3 mt-1 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <button onclick="checkResult()"
            class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg mt-4">
            Lihat Hasil
        </button>
    </div>

    <!-- HASIL -->
    <div id="resultSection" class="glass-card p-8 hidden">
        <h2 class="text-2xl font-bold text-center mb-4">Hasil Kelulusan</h2>

        <div class="space-y-2 text-gray-700">
            <div class="flex justify-between"><span>Nama:</span> <span id="resName" class="font-semibold text-right uppercase"></span></div>
                <div class="flex justify-between"><span>NISN:</span> <span id="resNisn" class="font-semibold"></span></div>
            <div class="flex justify-between"><span>Tempat, tanggal lahir: </span> <span id="resTtl"class="font-semibold"></span></div>
            <div class="flex justify-between"><span>Orang Tua: </span><span id="resOrangtua"class="font-semibold"></span></div>
            <div class="flex justify-between"><span>Keputusan: </span><span id="resKeputusan"class="font-semibold"></span></div>
            <div class="my-6 p-4 border-2 border-green-500 bg-green-50 rounded-xl">
<p class="text-center text-gray-600 text-xs uppercase tracking-widest">Status Kelulusan</p>
    <div class="font-bold text-green-600 text-center text-4xl">LULUS</div>
</div>

        <div class="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-100">
                    <p class="font-bold text-blue-800 mb-2 text-sm text-center">Dokumen dari Sekolah</p>
            <div id="resNilai"></div>
        </div>

        <button onclick="location.reload()" class="mt-4 w-full bg-gray-300 py-2 rounded">
            Kembali
        </button>
    </div>

</main>

<footer class="py-6 text-center text-gray-400 text-xs">
    &copy; 2026 Tim IT SMAN 3 Wonogiri
</footer>

function checkResult() {
    const inputNisn = document.getElementById('inputNisn').value.trim();
    const student = dataPeserta.find(s => s.nisn === inputNisn);

    if (student) {
        document.getElementById('loginSection').style.display = "none";
        document.getElementById('resultSection').style.display = "block";
        <button onclick="window.print()" class="mt-2 w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700">
    Cetak Bukti Lulus
</button>
        @media print {
    button, footer { display: none !important; }
    body { background: white; }
    .glass-card { box-shadow: none; border: 1px solid #ccc; }
}
        document.getElementById('resName').innerText = student.nama;
        document.getElementById('resNisn').innerText = student.nisn;
        document.getElementById('resTtl').innerText = student.ttl;
        document.getElementById('resOrangtua').innerText = student.orangtua;
        document.getElementById('resKeputusan').innerText = student.keputusan;

        const nilaiHtml = student.nilai.split('--').map(item => {
            const [label, value] = item.split(':');
            return `<div class="nilai-row">
                        <span>${label}</span>
                        <span>${value}</span>
                    </div>`;
        }).join('');

        document.getElementById('resNilai').innerHTML = nilaiHtml;

    } else {
        alert("Data tidak ditemukan!");
    }
}
